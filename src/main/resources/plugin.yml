name: TA_BlockTrigger
version: '${project.version}'
main: com.mamadta.tablocktrigger.TABlockTrigger
api-version: '1.20'
author: MamaD_TA
description: Bind any command to any block. Works on Paper, Spigot and CraftBukkit (1.20.1+).

commands:
  bt:
    description: Assign, remove, reload and inspect commands bound to blocks.
    usage: |
      /bt <console|player> <command> [right|left|both]
      /bt remove | /bt reload | /bt help
    aliases: [ctb, tbt, blocktrigger, tablocktrigger, cmdtoblock]

permissions:
  tablocktrigger.admin:
    description: Allows using the /bt management command (configured by default for all operators).
    default: op
  tablocktrigger.use:
    description: Allows triggering block commands when execution.require-permission is enabled.
    default: true
